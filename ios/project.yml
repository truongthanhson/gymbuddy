name: GymBuddy
options:
  bundleIdPrefix: com.gymbuddy
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
targets:
  GymBuddy:
    type: application
    platform: iOS
    sources:
      - path: GymBuddy
      # Built-in exercise library shared with the Android app.
      - path: ../shared/exercises.json
        buildPhase: resources
      # Supabase project URL and anon key; empty means offline only.
      - path: ../shared/supabase.json
        buildPhase: resources
    info:
      path: GymBuddy/Info.plist
      properties:
        CFBundleDisplayName: GymBuddy
        CFBundleLocalizations: [en, vi]
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSHealthUpdateUsageDescription: GymBuddy saves your finished workouts and body weight to Apple Health.
        NSHealthShareUsageDescription: GymBuddy does not read your health data; iOS asks for this text with write access.
    entitlements:
      path: GymBuddy/GymBuddy.entitlements
      properties:
        com.apple.developer.healthkit: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gymbuddy.app
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1"
    scheme:
      testTargets:
        - GymBuddyTests
  GymBuddyTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: GymBuddyTests
      - path: ../shared/test-vectors
        buildPhase: resources
    dependencies:
      - target: GymBuddy
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
