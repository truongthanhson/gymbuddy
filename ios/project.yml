name: GymBuddy
options:
  bundleIdPrefix: com.gymbuddy
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
  developmentLanguage: en
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
targets:
  GymBuddy:
    type: application
    platform: iOS
    sources:
      - path: GymBuddy
        excludes:
          - "*.storekit"
      # Code shared with the widget extension.
      - path: Shared
      # Built-in exercise library shared with the Android app.
      - path: ../shared/exercises.json
        buildPhase: resources
      # Supabase project URL and anon key; empty means offline only.
      - path: ../shared/supabase.json
        buildPhase: resources
    info:
      path: GymBuddy/Info.plist
      properties:
        CFBundleDisplayName: GymBuddy
        CFBundleLocalizations: [en, vi]
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSHealthUpdateUsageDescription: GymBuddy saves your finished workouts and body weight to Apple Health.
        NSHealthShareUsageDescription: GymBuddy does not read your health data; iOS asks for this text with write access.
        # Opens CSV exports shared from other apps, like Strong.
        CFBundleDocumentTypes:
          - CFBundleTypeName: CSV
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [public.comma-separated-values-text]
        LSSupportsOpeningDocumentsInPlace: false
    entitlements:
      path: GymBuddy/GymBuddy.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.applesignin: [Default]
        com.apple.security.application-groups: [group.com.gymbuddy.app]
    dependencies:
      - target: GymBuddyWidget
      - target: GymBuddyWatch
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gymbuddy.app
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1"
    scheme:
      testTargets:
        - GymBuddyTests
      # Local products for the simulator until App Store Connect has them.
      storeKitConfiguration: GymBuddy/GymBuddy.storekit
  GymBuddyWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: GymBuddyWidget
      - path: Shared
    info:
      path: GymBuddyWidget/Info.plist
      properties:
        CFBundleDisplayName: GymBuddy
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: GymBuddyWidget/GymBuddyWidget.entitlements
      properties:
        com.apple.security.application-groups: [group.com.gymbuddy.app]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gymbuddy.app.widget
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1"
  GymBuddyWatch:
    type: application
    platform: watchOS
    sources:
      - path: GymBuddyWatch
      # Phone ↔ watch protocol, shared with the iPhone app.
      - path: Shared/WatchLink.swift
    info:
      path: GymBuddyWatch/Info.plist
      properties:
        CFBundleDisplayName: GymBuddy
        CFBundleLocalizations: [en, vi]
        WKApplication: true
        WKCompanionAppBundleIdentifier: com.gymbuddy.app
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gymbuddy.app.watchkitapp
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "4"
  GymBuddyTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: GymBuddyTests
      - path: ../shared/test-vectors
        buildPhase: resources
    dependencies:
      - target: GymBuddy
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
